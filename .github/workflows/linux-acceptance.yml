name: Linux acceptance

# Manual only: runs the native acceptance Linux entry on a hosted runner.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-acceptance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux-x86_64:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm install --global npm@12.2.1 --ignore-scripts
      - run: npm ci --ignore-scripts
      - name: Record the environment
        id: environment
        run: |
          mkdir -p "$RUNNER_TEMP/acceptance"
          {
            uname -a
            docker version
            docker info
            docker compose version
            stat -fc %T /sys/fs/cgroup
            df -h /
          } 2>&1 | tee "$RUNNER_TEMP/acceptance/environment.txt"
      - name: Free disk space
        run: |
          df -h / | tee "$RUNNER_TEMP/acceptance/disk-before.txt"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h / | tee "$RUNNER_TEMP/acceptance/disk-after.txt"
      - name: Run the native acceptance Linux entry
        run: |
          set -o pipefail
          make native-acceptance ENTRIES=linux \
            RESULTS="$RUNNER_TEMP/acceptance/results.jsonl" 2>&1 \
            | tee "$RUNNER_TEMP/acceptance/run.log"
      - if: always() && steps.environment.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: linux-x86_64-acceptance
          path: ${{ runner.temp }}/acceptance
          if-no-files-found: error
          retention-days: 90
