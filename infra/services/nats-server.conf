# The image's bundled configuration has JetStream off.
port: 4222
monitor_port: 8222
jetstream {
  store_dir: /data/jetstream
}

# Static per-worker users for the JetStream spike (item 2); the product
# route is decentralized authentication (D9 a, item 13).
accounts {
  TASKELITH {
    jetstream: enabled
    users: [
      { user: integration, password: integration }
      {
        user: worker-a, password: worker-a
        permissions: {
          publish: { allow: [
            "$JS.API.CONSUMER.INFO.SPIKE_CMD.worker-a",
            "$JS.API.CONSUMER.MSG.NEXT.SPIKE_CMD.worker-a",
            "$JS.ACK.SPIKE_CMD.worker-a.>",
            "spike.obs.worker-a"
          ] }
          subscribe: { allow: ["_INBOX.worker-a.>"] }
        }
      }
      {
        user: worker-b, password: worker-b
        permissions: {
          publish: { allow: [
            "$JS.API.CONSUMER.INFO.SPIKE_CMD.worker-b",
            "$JS.API.CONSUMER.MSG.NEXT.SPIKE_CMD.worker-b",
            "$JS.ACK.SPIKE_CMD.worker-b.>",
            "spike.obs.worker-b"
          ] }
          subscribe: { allow: ["_INBOX.worker-b.>"] }
        }
      }
    ]
  }
}

# Clients without credentials, such as other integration tests.
no_auth_user: integration
