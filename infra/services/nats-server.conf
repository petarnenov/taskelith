# The image's bundled configuration has JetStream off.
port: 4222
monitor_port: 8222
jetstream {
  store_dir: /data/jetstream
}

# Decentralized authentication (D9 (a)): scripts/services.sh writes the
# test operator, accounts, and full resolver preload before the start.
include ./secrets/authority.conf

# TLS with a test CA (O3 (c)); plain clients stay allowed for the proxy.
tls {
  cert_file: "/etc/nats/secrets/server-cert.pem"
  key_file: "/etc/nats/secrets/server-key.pem"
}
allow_non_tls: true
