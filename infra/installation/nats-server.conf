# The image's bundled configuration has JetStream off.
port: 4222
monitor_port: 8222
# A fixed file store, not 75% of the free disk; the control plane's streams
# reserve 5 x TASKELITH_STREAM_MAX_BYTES of it (compose.yaml).
jetstream {
  store_dir: /data/jetstream
  max_file_store: 8GiB
}

# Broker trust written by the control plane's init and copied here by
# scripts/installation.sh; its resolver keeps the account JWTs in /data/jwt.
include ./authority/nats-authority.conf
