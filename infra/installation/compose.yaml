# Minimal local installation (G2 item 23); run it through the make targets,
# which build the images and order the bootstrap (scripts/installation.sh).

x-postgres-url: &postgres-url
  postgres://taskelith:${TASKELITH_POSTGRES_PASSWORD:?set TASKELITH_POSTGRES_PASSWORD}@postgres:5432/taskelith

services:
  postgres:
    image: postgres:18.6-trixie@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
    environment:
      POSTGRES_USER: taskelith
      POSTGRES_PASSWORD: ${TASKELITH_POSTGRES_PASSWORD:?set TASKELITH_POSTGRES_PASSWORD}
      POSTGRES_DB: taskelith
    volumes:
      - postgres-data:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "--host", "127.0.0.1", "--username", "taskelith", "--dbname", "taskelith"]
      interval: 1s
      timeout: 5s
      retries: 60

  # One-shot, as root: copies the broker trust and TLS files from the data
  # root and hands NATS its volumes.
  nats-setup:
    image: nats:2.15.1-alpine@sha256:7ae34c25dfd6fe2e01c6483eabef20d796690fdcac6c4d94ca780a6cf9877fde
    profiles: [setup]
    entrypoint: ["sh", "-euc"]
    command:
      - >-
        cd /control-plane-data/control-plane
        && install -o 10002 -g 10002 -m 0400 nats-authority.conf nats-certificate.pem nats-key.pem
        /etc/nats/authority/
        && chown 10002:10002 /etc/nats/authority /data
    network_mode: none
    volumes:
      - control-plane-data:/control-plane-data:ro
      - nats-authority:/etc/nats/authority
      - nats-data:/data

  nats:
    image: nats:2.15.1-alpine@sha256:7ae34c25dfd6fe2e01c6483eabef20d796690fdcac6c4d94ca780a6cf9877fde
    user: "10002:10002"
    volumes:
      - ./nats-server.conf:/etc/nats/nats-server.conf:ro
      - nats-authority:/etc/nats/authority:ro
      - nats-data:/data
    # TLS only (nats-server.conf), published on localhost only.
    ports:
      - "127.0.0.1:${TASKELITH_NATS_PUBLISH_PORT-4222}:4222"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8222/healthz?js-enabled-only=true"]
      interval: 1s
      timeout: 5s
      retries: 60

  control-plane:
    image: taskelith-control-plane:${TASKELITH_IMAGE_TAG:?run through scripts/installation.sh}
    pull_policy: never
    environment:
      TASKELITH_POSTGRES_URL: *postgres-url
      # The broker CA defaults to the installation CA in the data root.
      TASKELITH_NATS_URL: nats://nats:4222
      # 1 GiB per stream fits the broker's file store (nats-server.conf).
      TASKELITH_STREAM_MAX_BYTES: "1073741824"
    volumes:
      - control-plane-data:/var/lib/taskelith
    # HTTPS only: the worker API and the browser endpoint, on localhost.
    ports:
      - "127.0.0.1:${TASKELITH_API_PUBLISH_PORT-8080}:8080"
      - "127.0.0.1:${TASKELITH_BROWSER_PUBLISH_PORT-8443}:8443"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # The API has no health endpoint yet; an accepted connection counts.
      test: ["CMD", "node", "-e", "require('net').connect(8080, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))"]
      interval: 1s
      timeout: 5s
      retries: 60

  # One-shot administrative entry (installation contract section 4).
  admin:
    image: taskelith-control-plane:${TASKELITH_IMAGE_TAG:?run through scripts/installation.sh}
    pull_policy: never
    profiles: [admin]
    entrypoint: ["node", "apps/control-plane/dist/admin/admin-main.js"]
    environment:
      TASKELITH_POSTGRES_URL: *postgres-url
      TASKELITH_NATS_URL: nats://nats:4222
      # The names that the server certificates of init and
      # issue-installation-certificates hold.
      TASKELITH_API_HOSTS: ${TASKELITH_API_HOSTS:-control-plane,localhost,127.0.0.1}
      TASKELITH_NATS_HOSTS: ${TASKELITH_NATS_HOSTS:-nats,localhost,127.0.0.1}
    volumes:
      - control-plane-data:/var/lib/taskelith

  worker:
    image: taskelith-worker:${TASKELITH_IMAGE_TAG:?run through scripts/installation.sh}
    pull_policy: never
    profiles: [worker]
    # Root only for the entrypoint, which delegates the private cgroup
    # namespace and keeps SETUID, SETGID, and KILL for the worker.
    user: "0:0"
    cgroup: private
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, KILL, SETGID, SETPCAP, SETUID, SYS_ADMIN]
    # The remount of /sys/fs/cgroup needs no AppArmor profile in its way;
    # the seccomp profile refuses namespaces despite SYS_ADMIN (seccomp/).
    security_opt: ["apparmor=unconfined", "no-new-privileges=true", "seccomp=./seccomp/worker.json"]
    # Reaps executions whose supervisor ended first.
    init: true
    environment:
      TASKELITH_CONTROL_PLANE_URL: https://control-plane:8080
      TASKELITH_NATS_URL: nats://nats:4222
      # Read only on the first start, which checks and pins the CA and enrolls.
      TASKELITH_ENROLLMENT_TOKEN: ${TASKELITH_ENROLLMENT_TOKEN:-}
      TASKELITH_INSTALLATION_CA_SHA256: ${TASKELITH_INSTALLATION_CA_SHA256:-}
    volumes:
      - worker-data:/var/lib/taskelith
    depends_on:
      control-plane:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  control-plane-data:
  nats-authority:
  nats-data:
  worker-data:
